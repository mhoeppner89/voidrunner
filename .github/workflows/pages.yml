name: Deploy Voidrunner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/assets/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .workbench/hull-delivery
          key: hulls-${{ runner.os }}-${{ hashFiles('assets/models/ships/lancer.glb', 'assets/models/ships/torsas.glb', 'tools/assets/pack-hull-textures.py', 'tools/assets/requirements.txt', '.github/workflows/pages.yml') }}
      - name: Package game runtime
        run: npm run build
      - name: Upload game runtime
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
