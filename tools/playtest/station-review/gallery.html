<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Voidrunner · Station architecture</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#e9e2d1;font:15px/1.5 system-ui,sans-serif}header{max-width:1600px;margin:auto;padding:32px 24px 20px}.version{display:block;font-size:12px;letter-spacing:.08em;color:#94b1c5;margin-bottom:8px}h1{font-size:clamp(24px,4vw,36px);line-height:1.1;margin:0 0 12px;color:#eec976}p{margin:0;color:#acbecb;max-width:65ch}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,a{color:inherit;text-decoration:none}nav button,nav a{font:inherit;border:1px solid #37536b;background:#102435;padding:9px 15px;cursor:pointer}nav button[aria-pressed=true]{border-color:#eec976;color:#eec976}main{max-width:1600px;margin:auto;padding:0 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}.port{display:block;background:#0d1c2b;border:1px solid #294152;overflow:hidden;transition:border-color .15s}.port:hover{border-color:#eec976}.port img{display:block;width:100%;aspect-ratio:1.5;object-fit:cover;background:#07111d}.copy{padding:16px}h2{margin:0 0 5px;font-size:19px;font-weight:600;color:#e9e2d1}.copy p{font-size:13px;line-height:1.45}.hint{margin-top:8px;font-size:12px;color:#eec976}@media(max-width:600px){header{padding:24px 14px 18px}main{padding:0 14px 30px}.copy{padding:12px}}
</style><header><span class="version">MODEL REVISION 0.8.2kn</span><h1>Station architecture</h1><p>Inhabited trading districts, deep armored hangars, working shipyards and frontier outposts. Open a station to orbit it, inspect its landing space or compare it with the previous model.</p><nav><button data-angle="front" aria-pressed="true">Approach view</button><button data-angle="bottom" aria-pressed="false">Underside</button><button data-angle="rear" aria-pressed="false">Rear view</button><a href="./index.html?station=torchwell&revision=0.8.2kn">3D workshop ↗</a><a href="/game.html?revision=0.8.2kn">Game ↗</a></nav></header><main aria-live="polite"></main><script type="module">
const reports=await fetch('./models.json?revision=0.8.2kn').then(r=>r.json()),names={helix:'Helix Freeport',rook:'Rook Bastion',cairn:'Cairn Yard',argent:'Argent Spindle','gatehouse-twelve':'Gatehouse Twelve',blackglass:'Blackglass',cinder:'Cinder Works',torchwell:'Torchwell',nacre:'Nacre Research',shepherd:'Shepherd Relay',haven:'Haven Anchorage','league-yard':'League Yard',cinderfall:'Cinderfall'};
let angle='front';const main=document.querySelector('main');
function draw(){main.replaceChildren(...Object.entries(names).map(([id,name])=>{const card=document.createElement('a');card.className='port';card.href=`./index.html?station=${id}&view=${angle==='bottom'?'underside':angle==='rear'?'rear':'overview'}&revision=0.8.2kn`;const image=new Image();image.src=`./renders/${id}-${angle}.png?revision=0.8.2kn`;image.alt=name+(angle==='bottom'?' from underneath':angle==='rear'?' from the rear':' from the approach');image.loading='lazy';card.append(image);const copy=document.createElement('div');copy.className='copy';const title=document.createElement('h2');title.textContent=name;const description=document.createElement('p');description.textContent=reports[id].architecture.silhouette??reports[id].architecture.strategy;const hint=document.createElement('div');hint.className='hint';hint.textContent='Inspect in 3D ↗';copy.append(title,description,hint);card.append(copy);return card;}));}
for(const button of document.querySelectorAll('[data-angle]'))button.onclick=()=>{angle=button.dataset.angle;for(const b of document.querySelectorAll('[data-angle]'))b.setAttribute('aria-pressed',String(b===button));draw();};draw();
</script></html>
