<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voidrunner · Namen bearbeiten</title><style>
:root{--bg:#081321;--panel:#101f30;--line:#2d4558;--text:#e5edf1;--muted:#9bb2c2;--gold:#edc276;--cyan:#79dfeb;--green:#8adaac;--red:#ff9c9c;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:3;background:#081321f5;border-bottom:1px solid var(--line);padding:18px max(20px,calc((100vw - 1440px)/2));backdrop-filter:blur(8px)}.top,.actions,.filters,.preview-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:14px}h1{font-size:22px;font-weight:650;margin:0}.top small,#status{color:var(--muted);font-size:12px}button,select,input{font:inherit}button,select,.file-button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;min-height:42px}button:hover,.file-button:hover{border-color:var(--cyan)}button.primary{color:var(--gold);border-color:var(--gold)}button:disabled{opacity:.45;cursor:default}.filters{gap:8px}.filters input{flex:1;min-width:180px}.filters button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}input[type=text],input[type=search]{color:var(--text);background:#091420;border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:42px;width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}main{max-width:1440px;margin:auto;padding:22px 20px 48px}.intro{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;color:var(--muted);font-size:13px}.intro p{margin:0}.preview-controls select{min-height:36px;padding:5px 8px}.columns,.name-row{display:grid;grid-template-columns:minmax(230px,1.05fr) minmax(200px,1fr) minmax(200px,1fr) minmax(220px,1.05fr);gap:20px}.columns{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:0 16px 10px}.name-row{align-items:start;border-top:1px solid var(--line);padding:18px 16px;background:var(--panel)}.name-row:last-child{border-bottom:1px solid var(--line)}.name-row:not(.changed) .original{display:none}.name-row.changed{box-shadow:inset 3px 0 var(--gold)}.name-row.invalid{box-shadow:inset 3px 0 var(--red)}.identity{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;min-height:52px}.identity .item-icon{width:44px;height:44px;--item-color:#a8d9e8}.identity strong{font-size:13px;font-weight:550;overflow-wrap:anywhere}.identity small{display:block;margin-top:4px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.identity .kind-symbol{color:var(--cyan);font:500 26px/1 system-ui;text-align:center}.name-field label{display:none}.name-field input{font-size:14px}.original{color:var(--muted);font-size:11px;margin:6px 0 0;overflow-wrap:anywhere}.preview{min-height:46px;display:flex;align-items:center;color:var(--cyan);font-weight:600;font-size:16px;overflow-wrap:anywhere}.preview.named{color:var(--gold)}.effects{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:5px;font-size:11px;color:var(--muted)}.effects b{color:var(--text);font-weight:500}.row-reset{padding:4px 6px;min-height:24px;font-size:11px;background:transparent;margin-top:8px;color:var(--muted)}.details{grid-column:2/-1;font-size:12px;color:var(--muted)}.details summary{cursor:pointer}.details p{margin:8px 0 0;max-width:1000px}.name-row[hidden]{display:none}.name-row input[aria-invalid=true]{border-color:var(--red)}#notice{font-size:13px;color:var(--green);min-height:20px;margin:0 0 12px}#notice.error{color:var(--red)}#empty{padding:36px;color:var(--muted);text-align:center}footer{padding-top:20px;color:var(--muted);font-size:12px}a{color:var(--gold)}.file-button input{display:none}/*__ICON_CSS__*/
@media(max-width:1100px){.columns,.name-row{grid-template-columns:minmax(175px,.9fr) minmax(145px,1fr) minmax(145px,1fr)}.columns>span:last-child{display:none}.preview-cell{grid-column:2/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.preview{font-size:15px;min-height:25px}.effects{margin:0}.details{grid-column:1/-1}.name-row{gap:12px 16px}.identity{grid-row:span 2}.top{gap:8px}header{padding:12px 16px}.top h1{font-size:19px}.actions{gap:6px}.actions button,.file-button{font-size:13px;padding:7px 10px;min-height:36px}}
@media(max-width:600px){main{padding:16px 10px}header{position:static}.top{align-items:start}.columns{display:none}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.filters input{grid-column:1/-1;min-width:0}.filters select{min-width:0}.name-row{grid-template-columns:1fr;padding:16px 12px}.identity{grid-row:auto}.name-field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.preview-cell,.details{grid-column:1}.original{display:none}.actions{width:100%}.top h1{width:100%}.intro{gap:12px}.name-field input{font-size:16px}.preview{overflow-wrap:anywhere}}
@media(max-height:500px) and (orientation:landscape){header{position:static;padding:8px 12px}.top{margin-bottom:8px}.top h1{font-size:17px}.top h1 small{display:none}.top #status{font-size:10px}.actions{gap:5px}.actions button,.file-button{padding:6px 8px;min-height:32px;font-size:12px}.filters button,.filters select,.filters input{min-height:34px;font-size:12px;padding:6px 8px}main{padding-top:12px}.intro{font-size:12px;gap:8px;margin-bottom:8px}.preview-controls{gap:8px}.preview-controls select{min-height:30px;font-size:12px}.columns{padding-bottom:6px}#notice:empty{display:none}.name-row{padding:12px;gap:8px 12px}}
</style></head><body>
<header><div class="top"><h1>VOIDRUNNER <small>· Namen bearbeiten</small></h1><div class="actions"><span id="status" role="status">Aktuelle Namen</span><button id="export" class="primary">JSON exportieren</button><label class="file-button">JSON importieren<input id="import" type="file" accept=".json,application/json"></label></div></div><div class="filters"><input id="search" type="search" placeholder="Name oder Wirkung suchen" aria-label="Namen suchen"><select id="section" aria-label="Namensgruppe"><option value="equipment">Ausrüstung (26)</option><option value="terms">Stat-Begriffe</option><option value="affixes">Upgrades (7)</option><option value="named">Eigennamen (5)</option><option value="all">Alle Namen</option></select><select id="category" aria-label="Ausrüstungstyp"><option value="all">Alle Typen</option><option value="gun">Kanonen</option><option value="launcher">Raketen & Torpedos</option><option value="turret">Geschütztürme</option><option value="power">Energie</option><option value="drive">Antrieb</option><option value="defense">Schutz</option><option value="utility">Systeme</option></select><button id="changed" aria-pressed="false">Nur Änderungen</button></div></header>
<main><div class="intro"><p>Lokaler Entwurf · Änderungen per JSON ins Spiel übernehmen.</p><div class="preview-controls"><label>Vorschau <select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label><label>Stufe <select id="tier"><option value="1">I</option><option value="2">II</option><option value="3">III</option></select></label></div></div><p id="notice" role="status" aria-live="polite"></p><div class="columns"><span>Teil / Bedeutung</span><span>Deutsch</span><span>English</span><span>Im Spiel</span></div><div id="rows"></div><div id="empty" hidden>Keine passenden Namen.</div><footer><button id="reset-all">Alle Änderungen zurücksetzen</button> · <a href="../../game.html?revision=0.8.2fz">Spiel öffnen ↗</a></footer></main>
<script>
const DATA=/*__DATA__*/;
const ORIGINAL=DATA.base,STORAGE='voidrunner-equipment-names-draft-v1',groups=['equipment','terms','affixes','named'];
let draft=structuredClone(ORIGINAL),changedOnly=false,storageOK=true;
const byId=id=>document.getElementById(id),views=[];
const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice=(text,error=false)=>{byId('notice').textContent=text;byId('notice').classList.toggle('error',error);};
function validated(input,{allowEmpty=false}={}){
 if(!input||input.schema!==ORIGINAL.schema)throw Error('Dieses JSON ist kein Voidrunner-Namensentwurf.');
 const next=structuredClone(ORIGINAL);
 for(const group of groups){if(!input[group]||typeof input[group]!=='object'||Array.isArray(input[group]))throw Error('Namensgruppen fehlen.');
  for(const [id,value] of Object.entries(input[group])){
   if(group==='equipment'&&id==='pulse-mk2'&&!Object.hasOwn(next[group],id))continue;
   if(!Object.hasOwn(next[group],id))throw Error('Unbekannter Eintrag: '+id);
   for(const lang of ['de','en']){if(typeof value?.[lang]!=='string'||!allowEmpty&&!value[lang].trim()||value[lang].length>80)throw Error('Ungültiger Name: '+id);next[group][id][lang]=value[lang].trim();}
  }
 }return next;
}
try{const saved=localStorage.getItem(STORAGE);if(saved)draft=validated(JSON.parse(saved),{allowEmpty:true});}catch(error){notice('Gespeicherter Entwurf konnte nicht geladen werden. '+error.message,true);}
const categories={gun:'Kanone',launcher:'Raketen / Torpedos',turret:'Geschützturm',power:'Energie',drive:'Antrieb',defense:'Schutz',utility:'System',terms:'Stat-Begriff',affixes:'Upgrade',named:'Eigenname'};
function isChanged(row){return ['de','en'].some(lang=>draft[row.kind][row.id][lang]!==ORIGINAL[row.kind][row.id][lang]);}
function previewText(row){const language=byId('language').value,tier=Math.max(row.minTier??1,Number(byId('tier').value)),roman=['I','II','III'][tier-1],value=draft[row.kind][row.id][language];
 if(row.kind==='equipment')return value+'\u00a0'+roman;
 if(row.kind==='named')return draft.equipment[row.id][language]+'\u00a0'+roman+' · '+value;
 if(row.kind==='affixes')return draft.equipment[row.sampleId][language]+'\u00a0'+roman+' · '+value;
 return value;
}
function refresh(){
 let count=0,invalid=false;
 const duplicates=new Set();for(const lang of ['de','en']){const seen=new Map();for(const row of DATA.rows){const key=row.kind+'|'+draft[row.kind][row.id][lang].trim().toLocaleLowerCase();if(seen.has(key)){duplicates.add(seen.get(key));duplicates.add(row.kind+'|'+row.id);}else seen.set(key,row.kind+'|'+row.id);}}
 for(const view of views){const {row,element}=view,changed=isChanged(row);count+=Number(changed);element.classList.toggle('changed',changed);
  const bad=duplicates.has(row.kind+'|'+row.id)||['de','en'].some(lang=>!draft[row.kind][row.id][lang].trim());invalid||=bad;element.classList.toggle('invalid',bad);
  for(const lang of ['de','en'])view[lang].setAttribute('aria-invalid',String(bad));
  view.preview.textContent=previewText(row);
  const lang=byId('language').value;
  view.effects.replaceChildren();for(const effect of row.effects??[]){const el=document.createElement('span'),b=document.createElement('b');el.textContent=(draft.terms[effect.label]?.[lang]??effect.label)+' ';b.textContent=(effect.value>0?'+':'')+new Intl.NumberFormat(lang,{maximumFractionDigits:1}).format(effect.value)+effect.unit;el.append(b);view.effects.append(el);}
  if(row.kind!=='terms'){const tier=Math.max(row.minTier??1,Number(byId('tier').value)),icon=element.querySelector('.item-icon');icon.dataset.tier=tier;icon.querySelector('.item-tier-mark').setAttribute('d',Array.from({length:tier},(_,i)=>{const x=32-(tier-1)*5+i*10;return `M${x} 56l3 3-3 3-3-3z`;}).join(''));}
  if(row.description)view.description.textContent=row.description[lang];
 }
 byId('export').disabled=invalid;if(invalid)notice('Leere oder doppelte Namen prüfen.',true);else if(byId('notice').textContent==='Leere oder doppelte Namen prüfen.')notice('');byId('status').textContent=(count?count+' geändert':'Aktuelle Namen')+(storageOK?' · lokal gespeichert':' · Export erforderlich');
 byId('status').style.color=invalid?'var(--red)':count?'var(--gold)':'var(--muted)';
 byId('export').title=invalid?'Leere oder doppelte Namen prüfen.':'Entwurf als JSON speichern';
}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(draft));storageOK=true;}catch{storageOK=false;notice('Browserspeicher nicht verfügbar. Bitte JSON exportieren.',true);}refresh();}
function filter(){let visible=0;const group=byId('section').value,category=byId('category').value,query=byId('search').value.trim().toLocaleLowerCase();byId('category').disabled=!['all','equipment'].includes(group);
 for(const {row,element} of views){const names=draft[row.kind][row.id],text=[row.id,names.de,names.en,...Object.values(ORIGINAL[row.kind][row.id]),...Object.values(row.description??{}),...(row.effects??[]).flatMap(e=>Object.values(draft.terms[e.label]??{en:e.label}))].join(' ').toLocaleLowerCase();const show=(group==='all'||row.kind===group)&&(category==='all'||row.kind!=='equipment'||row.category===category)&&(!changedOnly||isChanged(row))&&text.includes(query);element.hidden=!show;visible+=Number(show);}byId('empty').hidden=visible>0;
}
function render(){byId('rows').replaceChildren();views.length=0;
 for(const row of DATA.rows){const value=draft[row.kind][row.id],original=ORIGINAL[row.kind][row.id],element=document.createElement('article');element.className='name-row';element.dataset.kind=row.kind;element.dataset.id=row.id;
 element.innerHTML=`<div class="identity">${row.icon??'<span class="kind-symbol">Aa</span>'}<div><strong>${html(original.de)}</strong><small>${html(categories[row.category])} · ${html(row.id)}</small><button class="row-reset" type="button">Zurücksetzen</button></div></div><div class="name-field"><label>Deutsch</label><input type="text" maxlength="80" data-lang="de" aria-label="Deutsch: ${html(original.de)}"><p class="original">${html(original.de)}</p></div><div class="name-field"><label>English</label><input type="text" maxlength="80" data-lang="en" aria-label="English: ${html(original.en)}"><p class="original">${html(original.en)}</p></div><div class="preview-cell"><div class="preview ${row.kind==='named'?'named':''}"></div><div class="effects"></div></div>${row.description?'<details class="details"><summary>Funktion</summary><p></p></details>':''}`;
 const view={row,element,de:element.querySelector('[data-lang=de]'),en:element.querySelector('[data-lang=en]'),preview:element.querySelector('.preview'),effects:element.querySelector('.effects'),description:element.querySelector('.details p')};
 for(const lang of ['de','en']){view[lang].value=value[lang];view[lang].addEventListener('input',()=>{draft[row.kind][row.id][lang]=view[lang].value;persist();});}
 element.querySelector('.row-reset').addEventListener('click',()=>{draft[row.kind][row.id]=structuredClone(original);for(const lang of ['de','en'])view[lang].value=original[lang];persist();filter();});
 views.push(view);byId('rows').append(element);
 }refresh();filter();
}
byId('search').addEventListener('input',filter);for(const id of ['section','category'])byId(id).addEventListener('change',filter);
for(const id of ['tier','language'])byId(id).addEventListener('change',refresh);
byId('changed').addEventListener('click',()=>{changedOnly=!changedOnly;byId('changed').setAttribute('aria-pressed',String(changedOnly));filter();});
byId('export').addEventListener('click',()=>{const output=structuredClone(draft);for(const group of groups)for(const value of Object.values(output[group]))for(const lang of ['de','en'])value[lang]=value[lang].trim();const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)+'\n'],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='voidrunner-equipment-names.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('JSON exportiert. Die Spielnamen bleiben bis zur Übernahme unverändert.');});
byId('import').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{draft=validated(JSON.parse(await file.text()));render();persist();notice('Entwurf importiert.');}catch(error){notice(error.message,true);}finally{event.target.value='';}});
byId('reset-all').addEventListener('click',()=>{if(!confirm('Alle Namensänderungen zurücksetzen?'))return;draft=structuredClone(ORIGINAL);render();persist();notice('Aktuelle Spielnamen wiederhergestellt.');});
render();
</script></body></html>
